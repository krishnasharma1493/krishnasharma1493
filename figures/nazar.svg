ext-anchor="start">read their traffic to find</text><text x="640.0" y="266.0" font-size="18" font-weight="400" fill="#c9d1d9" text-anchor="start">them.</text><text x="640" y="306" font-size="18" fill="#c9d1d9" xml:space="preserve"><tspan font-weight="700" fill="#7ee787">Solution.</tspan> Flash a coded light</text><text x="640.0" y="332.0" font-size="18" font-weight="400" fill="#c9d1d9" text-anchor="start">pattern at the room. A camera</text><text x="640.0" y="358.0" font-size="18" font-weight="400" fill="#c9d1d9" text-anchor="start">that sees it shifts its</text><text x="640.0" y="384.0" font-size="18" font-weight="400" fill="#c9d1d9" text-anchor="start">bitrate, and a cheap Wi-Fi</text><text x="640.0" y="410.0" font-size="18" font-weight="400" fill="#c9d1d9" text-anchor="start">chip catches the rhythm in</text><text x="640.0" y="436.0" font-size="18" font-weight="400" fill="#c9d1d9" text-anchor="start">packet timing.</text><line x1="40" y1="456" x2="960" y2="456" stroke="#30363d"/><text x="40.0" y="486.0" font-size="15" font-weight="400" fill="#8b949e" text-anchor="start">code by language</text><rect x="40.0" y="500" width="677.2" height="12" fill="#1f6feb"><title>Python: 74%</title></rect><rect x="719.2" y="500" width="181.7" height="12" fill="#db6d28"><title>JavaScript: 20%</title></rect><rect x="902.9" y="500" width="23.6" height="12" fill="#bf4b8a"><title>CSS / HTML: 3%</title></rect><rect x="928.4" y="500" width="29.6" height="12" fill="#484f58"><title>C++ &amp; other: 3%</title></rect><rect x="40.0" y="532" width="12" height="12" fill="#1f6feb"/><path transform="translate(60.0 529.4) scale(0.7438)" fill="#c9d1d9" d="M14.25.18l.9.2.73.26.59.3.45.32.34.34.25.34.16.33.1.3.04.26.02.2-.01.13V8.5l-.05.63-.13.55-.21.46-.26.38-.3.31-.33.25-.35.19-.35.14-.33.1-.3.07-.26.04-.21.02H8.77l-.69.05-.59.14-.5.22-.41.27-.33.32-.27.35-.2.36-.15.37-.1.35-.07.32-.04.27-.02.21v3.06H3.17l-.21-.03-.28-.07-.32-.12-.35-.18-.36-.26-.36-.36-.35-.46-.32-.59-.28-.73-.21-.88-.14-1.05-.05-