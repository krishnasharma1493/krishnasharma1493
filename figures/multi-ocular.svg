<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs><rect x="0.5" y="0.5" width="999" height="559" fill="#0d1117" stroke="#30363d"/><text x="40.0" y="48.0" font-size="15" font-weight="700" fill="#8b949e" text-anchor="start" letter-spacing="3">FIG. 4</text><text x="40.0" y="92.0" font-size="32" font-weight="700" fill="#f0f6fc" text-anchor="start">Multi-Ocular</text><text x="286.4" y="92.0" font-size="22" font-weight="700" fill="#58a6ff" text-anchor="start">— 4 diseases, 1 photo</text><text x="40.0" y="122.0" font-size="17" font-weight="400" fill="#8b949e" text-anchor="start">Retinal screening research prototype · not a medical device</text><text x="960.0" y="92.0" font-size="18" font-weight="400" fill="#58a6ff" text-anchor="end">repo →</text><rect x="40.0" y="235.0" width="91.2" height="60.0" fill="#0d1117" stroke="#8b949e"/><text x="85.6" y="259.0" font-size="16" font-weight="700" fill="#c9d1d9" text-anchor="middle">retinal</text><text x="85.6" y="281.0" font-size="16" font-weight="400" fill="#8b949e" text-anchor="middle">photo</text><rect x="219.3" y="235.0" width="168.0" height="60.0" fill="#0d1117" stroke="#8b949e"/><path transform="translate(258.5 245.2) scale(0.7000)" fill="#c9d1d9" d="M12.005 0L4.952 7.053a9.865 9.865 0 000 14.022 9.866 9.866 0 0014.022 0c3.984-3.9 3.986-10.205.085-14.023l-1.744 1.743c2.904 2.905 2.904 7.634 0 10.538s-7.634 2.904-10.538 0-2.904-7.634 0-10.538l4.647-4.646.582-.665zm3.568 3.899a1.327 1.327 0 00-1.327 1.327 1.327 1.327 0 001.327 1.328A1.327 1.327 0 0016.9 5.226 1.327 1.327 0 0015.573 3.9z"/><text x="280.9" y="259.0" font-size="16" font-weight="700" fill="#c9d1d9">PyTorch</text><text x="303.3" y="281.0" font-size="16" font-weight="400" fill="#8b949e