xt><text x="640.0" y="214.0" font-size="18" font-weight="400" fill="#c9d1d9" text-anchor="start">most screening models look</text><text x="640.0" y="240.0" font-size="18" font-weight="400" fill="#c9d1d9" text-anchor="start">for only one.</text><text x="640" y="280" font-size="18" fill="#c9d1d9" xml:space="preserve"><tspan font-weight="700" fill="#7ee787">Solution.</tspan> One model checks a</text><text x="640.0" y="306.0" font-size="18" font-weight="400" fill="#c9d1d9" text-anchor="start">retinal photo for myopia,</text><text x="640.0" y="332.0" font-size="18" font-weight="400" fill="#c9d1d9" text-anchor="start">cataract, glaucoma and</text><text x="640.0" y="358.0" font-size="18" font-weight="400" fill="#c9d1d9" text-anchor="start">diabetic retinopathy at once.</text><line x1="40" y1="456" x2="960" y2="456" stroke="#30363d"/><text x="40.0" y="486.0" font-size="15" font-weight="400" fill="#8b949e" text-anchor="start">code by language</text><rect x="40.0" y="500" width="918.0" height="12" fill="#1f6feb"><title>Python: 100%</title></rect><rect x="40.0" y="532" width="12" height="12" fill="#1f6feb"/><path transform="translate(60.0 529.4) scale(0.7438)" fill="#c9d1d9" d="M14.25.18l.9.2.73.26.59.3.45.32.34.34.25.34.16.33.1.3.04.26.02.2-.01.13V8.5l-.05.63-.13.55-.21.46-.26.38-.3.31-.33.25-.35.19-.35.14-.33.1-.3.07-.26.04-.21.02H8.77l-.69.05-.59.14-.5.22-.41.27-.33.32-.27.35-.2.36-.15.37-.1.35-.07.32-.04.27-.02.21v3.06H3.17l-.21-.03-.28-.07-.32-.12-.35-.18-.36-.26-.36-.36-.35-.46-.32-.59-.28-.73-.21-.88-.14-1.05-.05-1.23.06-1.22.16-1.04.24-.87.32-.71.36-.57.4-.44.42-.33.42-.24.4-.16.36-.1.32-.05.24-.01h.16l.06.01h8.16v-.83H6.18l-.01-2.75-.02-.37.05-.34.11-.31.17-.28.25-.26.31-.23.38-.2.44-.18.51-.15.58-.12.64-.1.71-.06.77-.04.84-.02 1.27.05zm-6.3 1.98l-.23.33-.08.41.08.41.23.34.33.22.41.09.41-.09.33-.22.23-.34.08-.41-.08-.41-.23-.33-.33-.22-.41-.09-.41.09zm13.09 3.95l.28.06.32.12.35.18.36.27.36.35.35.47.32.59.28.73.21.88.14 1.04.05 1.23-.06 1.23-.16 1.04-.24.86-.32.71-.36.